name: Deploy playable game to GitHub Pages

on:
  push:
    branches: [cursor/swap-side-nav-0c9e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare unchanged game files
        shell: bash
        run: |
          set -euo pipefail
          cmp '小櫻的同居日記.html' xiaoying-tongju-riji.html
          mkdir -p "$RUNNER_TEMP/ntr-site"
          cp index.html xiaoying-tongju-riji.html '小櫻的同居日記.html' sil-*.png "$RUNNER_TEMP/ntr-site/"
          touch "$RUNNER_TEMP/ntr-site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ntr-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
